[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bond-management"
version = "0.1.0"
description = "UK gilt prices from giltsyield.com paired with the DMO gilts in issue"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "requests",
    "beautifulsoup4",
    "curl_cffi",
    "xlrd",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]
lint = ["ruff"]

[tool.setuptools]
packages = ["bond_management"]

[tool.pytest.ini_options]
testpaths = ["tests"]
